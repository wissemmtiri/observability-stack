groups:

# 1) Queue health (RabbitMQ)
- name: alert_queue_health
  rules:
  # TEMP: prove we detect bursts reliably
  - alert: QueueBacklogHighTest
    expr: sli:rabbitmq_queue_depth:max2m{queue="orders"} > 100
    for: 1m
    labels:
      severity: ticket
      service: worker
      component: rabbitmq
    annotations:
      summary: "TEST: orders queue backlog > 100 in last 2m"
      description: "Temporary test alert to validate detection & routing."

  # Production SLO: page on sustained backlog
  - alert: QueueBacklogHigh
    expr: sli:rabbitmq_queue_depth:now{queue="orders"} > 500
    for: 15m
    labels:
      severity: ticket
      service: worker
      component: rabbitmq
    annotations:
      summary: "Orders queue backlog > 500 (sustained)"
      description: "Scale workers or investigate consumer errors."

# 2) API latency (per-path, seconds)
- name: alert_slo_api_latency
  rules:
  - alert: APIHighLatencyP95
    expr: sli:api_latency:p95:1m{path="/v1/orders"} > 0.1
    for: 10m
    labels:
      severity: ticket
      service: api
      slo: latency-p95-100ms
    annotations:
      summary: "p95 latency > 100ms on /v1/orders"
      description: "Investigate worker saturation, DB, or queue; see traces/logs."

  - alert: APIHighLatencyP99
    expr: sli:api_latency:p99:5m{path="/v1/orders"} > 0.2
    for: 10m
    labels:
      severity: ticket
      service: api
      slo: latency-p99-200ms
    annotations:
      summary: "p99 latency > 200ms on /v1/orders"
      description: "Tail latency elevated; check slow paths and downstreams."

# 3) API availability — burn-rate for 99.9% over 30d
# We use multi-window multi-burn thresholds.
- name: alert_slo_api_availability
  rules:
  # Fast burn: would exhaust budget quickly if sustained
  - alert: APIHighErrorBurnRateShort
    expr: |
      (sli:api_availability:error_ratio:5m{path="/v1/orders"} / 0.001) > 14.4
      and
      (avg_over_time(sli:api_availability:error_ratio:5m{path="/v1/orders"}[1h]) / 0.001) > 14.4
    for: 5m
    labels:
      severity: page
      service: api
      slo: availability-99.9-30d
    annotations:
      summary: "High error burn (short) on /v1/orders"
      description: "5m & 1h burn-rate > 14.4× budget (SLO 99.9%)."

  # Sustained burn: still serious but slower
  - alert: APIHighErrorBurnRateLong
    expr: |
      (avg_over_time(sli:api_availability:error_ratio:5m{path="/v1/orders"}[1h]) / 0.001) > 6
      and
      (avg_over_time(sli:api_availability:error_ratio:5m{path="/v1/orders"}[6h]) / 0.001) > 6
    for: 10m
    labels:
      severity: page
      service: api
      slo: availability-99.9-30d
    annotations:
      summary: "High error burn (long) on /v1/orders"
      description: "1h & 6h burn-rate > 6× budget (SLO 99.9%)."
