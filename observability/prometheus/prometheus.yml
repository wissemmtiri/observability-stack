global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: rabbitmq
    scrape_interval: 5s
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

rule_files:
  - "rules/*.yml"